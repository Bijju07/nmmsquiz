<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ಎನ್‌ಎಂಎಂಎಸ್ ಜಿಮ್ಯಾಟ್ 2017 · ರಸಪ್ರಶ್ನೆ</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Noto Sans Kannada', 'Segoe UI', system-ui, sans-serif;
    }
    body {
      background: #eef3f9;
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: white;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 20, 30, 0.12);
      padding: 2rem 2rem 2.5rem;
      position: relative;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0b2e4b;
      margin-top: 0;
      margin-bottom: 0.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .badge {
      background: #0b2e4b;
      color: white;
      border-radius: 40px;
      padding: 0.2rem 1rem;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .subhead {
      color: #2c5a7a;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      border-left: 5px solid #3b82f6;
      padding-left: 1rem;
      background: #f0f7ff;
      border-radius: 0 12px 12px 0;
      line-height: 1.5;
    }

    /* ---- ಹೆಸರು ---- */
    .name-section {
      background: #f9fcff;
      border: 1px solid #d9e8f5;
      border-radius: 20px;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1.8rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
    }
    .name-section label {
      font-weight: 600;
      color: #0b2e4b;
      font-size: 1rem;
    }
    .name-section input {
      flex: 1;
      min-width: 180px;
      padding: 0.7rem 1.2rem;
      border-radius: 40px;
      border: 2px solid #c5d9ec;
      font-size: 1rem;
      outline: none;
      transition: 0.15s;
      font-family: inherit;
    }
    .name-section input:focus {
      border-color: #1a5a9a;
      box-shadow: 0 0 0 4px rgba(26, 90, 154, 0.12);
    }

    /* ---- ಪ್ರಗತಿ ಪಟ್ಟಿ ---- */
    .progress-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .progress-track {
      flex: 1;
      height: 8px;
      background: #dbe7f2;
      border-radius: 40px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #1a5a9a, #3b9eff);
      border-radius: 40px;
      transition: width 0.3s ease;
    }
    .progress-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: #1a5a9a;
      min-width: 80px;
      text-align: right;
    }

    /* ---- ಪ್ರಶ್ನೆ ಕಾರ್ಡ್ ---- */
    .question-card {
      background: #f9fcff;
      border: 1px solid #d9e8f5;
      border-radius: 24px;
      padding: 1.8rem 1.8rem 1.5rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    }
    .q-num {
      display: inline-block;
      background: #2c5a7a;
      color: white;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      margin-bottom: 0.8rem;
    }
    .q-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #1a5a9a;
      margin-bottom: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .q-text {
      font-size: 1.15rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      color: #1a2e40;
      line-height: 1.7;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-bottom: 1.2rem;
    }
    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      font-size: 1rem;
      padding: 0.7rem 1.2rem;
      border-radius: 16px;
      background: #f0f6fd;
      transition: 0.1s;
      border: 2px solid transparent;
      line-height: 1.5;
    }
    .option:hover {
      background: #e0edfa;
      border-color: #aac7e3;
    }
    .option input[type="radio"] {
      accent-color: #1a5a9a;
      width: 20px;
      height: 20px;
      cursor: pointer;
      margin: 0;
      flex-shrink: 0;
    }
    .option.selected {
      background: #d0e2ff;
      border-color: #2c7ad0;
    }

    /* ---- ವಿವರಣೆ ---- */
    .explain {
      font-size: 0.95rem;
      background: #e6f0fa;
      border-left: 6px solid #3b82f6;
      padding: 0.9rem 1.2rem;
      border-radius: 12px;
      margin-top: 1rem;
      color: #0b2e4b;
      line-height: 1.6;
    }
    .explain strong {
      color: #0b3f6b;
    }
    .explain.wrong-explain {
      background: #fde8e8;
      border-left-color: #dc3545;
    }
    .explain.correct-explain {
      background: #e8f5e9;
      border-left-color: #28a745;
    }
    .hidden {
      display: none !important;
    }

    /* ---- ಸಂಬಂಧಿತ ಚಿತ್ರ ---- */
    .related-image {
      margin-top: 1rem;
      text-align: center;
    }
    .related-image img {
      max-width: 100%;
      border-radius: 12px;
      border: 2px solid #d9e8f5;
      background: white;
      padding: 0.5rem;
    }
    .related-image .img-label {
      font-size: 0.8rem;
      color: #6e8ba8;
      margin-top: 0.3rem;
    }

    /* ---- ಬಟನ್‌ಗಳು ---- */
    .btn-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      gap: 1rem;
    }
    .btn {
      background: #1a5a9a;
      color: white;
      border: none;
      padding: 0.8rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 6px 14px rgba(26, 90, 154, 0.2);
      border: 1px solid #0b3f6b;
      font-family: inherit;
    }
    .btn:hover {
      background: #0e4170;
      transform: scale(1.02);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    .btn-outline {
      background: white;
      color: #1a5a9a;
      border: 2px solid #1a5a9a;
      box-shadow: none;
    }
    .btn-outline:hover {
      background: #e6f0fa;
      transform: scale(1.02);
    }
    .btn-success {
      background: #1e7e34;
      border-color: #145523;
    }
    .btn-success:hover {
      background: #145523;
    }

    /* ---- ಅಂಕ ಪ್ಯಾನೆಲ್ ---- */
    .score-panel {
      background: #0b2e4b;
      color: white;
      padding: 1.8rem 2rem;
      border-radius: 28px;
      text-align: center;
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .score-panel h2 {
      margin: 0;
      font-weight: 500;
      font-size: 1.3rem;
    }
    .score-value {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1;
      color: #ffd966;
    }
    .score-total {
      font-size: 1.1rem;
      opacity: 0.8;
    }
    .score-message {
      font-weight: 400;
      opacity: 0.9;
      font-size: 0.95rem;
    }

    .footer-note {
      text-align: center;
      color: #6e8ba8;
      font-size: 0.8rem;
      margin-top: 2rem;
    }

    /* ---- ಫಲಿತಾಂಶ ವಿಮರ್ಶೆ ---- */
    .review-section {
      margin-top: 2rem;
      border-top: 3px solid #d0e2f5;
      padding-top: 1.5rem;
    }
    .review-section h3 {
      color: #0b2e4b;
      font-size: 1.3rem;
      margin-bottom: 1rem;
    }
    .review-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 1.2rem;
    }
    .filter-btn {
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      border: 2px solid #c5d9ec;
      background: white;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: 0.15s;
      font-family: inherit;
      color: #2c5a7a;
    }
    .filter-btn:hover {
      background: #f0f7ff;
      border-color: #1a5a9a;
    }
    .filter-btn.active {
      background: #1a5a9a;
      color: white;
      border-color: #1a5a9a;
    }
    .review-card {
      background: #f9fcff;
      border: 1px solid #d9e8f5;
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1.2rem;
      border-left: 6px solid #ccc;
    }
    .review-card.correct {
      border-left-color: #28a745;
    }
    .review-card.wrong {
      border-left-color: #dc3545;
    }
    .review-card.unanswered {
      border-left-color: #ffc107;
    }
    .review-card .r-q-num {
      display: inline-block;
      background: #2c5a7a;
      color: white;
      font-weight: 600;
      font-size: 0.8rem;
      padding: 0.15rem 0.8rem;
      border-radius: 30px;
      margin-bottom: 0.5rem;
    }
    .review-card .r-q-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #1a5a9a;
      margin-bottom: 0.3rem;
    }
    .review-card .r-q-text {
      font-size: 1.05rem;
      font-weight: 500;
      margin-bottom: 1rem;
      color: #1a2e40;
      line-height: 1.6;
    }
    .review-options {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .review-option {
      padding: 0.5rem 1rem;
      border-radius: 12px;
      background: #f0f6fd;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 2px solid transparent;
    }
    .review-option.correct-option {
      background: #d4edda;
      border-color: #28a745;
      font-weight: 600;
    }
    .review-option.wrong-option {
      background: #f8d7da;
      border-color: #dc3545;
      font-weight: 600;
    }
    .review-option .tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.1rem 0.6rem;
      border-radius: 20px;
      margin-left: auto;
      white-space: nowrap;
    }
    .tag-correct {
      background: #28a745;
      color: white;
    }
    .tag-wrong {
      background: #dc3545;
      color: white;
    }

    @media (max-width: 600px) {
      .container { padding: 1.2rem; }
      h1 { font-size: 1.4rem; }
      .question-card { padding: 1.2rem; }
      .q-text { font-size: 1rem; }
      .option { font-size: 0.9rem; padding: 0.6rem 1rem; }
      .btn { padding: 0.6rem 1.4rem; font-size: 0.9rem; }
      .score-panel { flex-direction: column; text-align: center; }
      .review-card { padding: 1rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🧠 ಎನ್‌ಎಂಎಂಎಸ್ · ಜಿಮ್ಯಾಟ್ 2017 <span class="badge">ರಸಪ್ರಶ್ನೆ</span></h1>
  <div class="subhead">
    ನ್ಯಾಷನಲ್ ಮೀನ್ಸ್ ಕಮ್-ಮೆರಿಟ್ ಸ್ಕಾಲರ್‌ಶಿಪ್ · ಸಾಮಾನ್ಯ ಬೌದ್ಧಿಕ ಸಾಮರ್ಥ್ಯ ಪರೀಕ್ಷೆ<br>
    ಒಂದೊಂದಾಗಿ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ · ಅಂಕ, ವಿವರಣೆ ಮತ್ತು ಚಿತ್ರಗಳನ್ನು ಪಡೆಯಿರಿ
  </div>

  <!-- ಹೆಸರು -->
  <div class="name-section">
    <label for="studentName">🎓 ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು:</label>
    <input type="text" id="studentName" placeholder="ನಿಮ್ಮ ಹೆಸರು ನಮೂದಿಸಿ..." autocomplete="off">
  </div>

  <!-- ಪ್ರಗತಿ -->
  <div class="progress-bar">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="progress-text" id="progressText">0 / 225</div>
  </div>

  <!-- ಪ್ರಶ್ನೆ ಪ್ರದೇಶ -->
  <div id="quizArea"></div>

  <!-- ಬಟನ್‌ಗಳು -->
  <div class="btn-bar">
    <button class="btn btn-outline" id="prevBtn" disabled>◀ ಹಿಂದೆ</button>
    <button class="btn" id="nextBtn">ಮುಂದೆ ▶</button>
    <button class="btn btn-success hidden" id="submitBtn">✅ ಸಲ್ಲಿಸಿ ಮತ್ತು ಅಂಕ ನೀಡಿ</button>
    <button class="btn btn-outline" id="resetBtn">🔄 ಮರುಹೊಂದಿಸಿ</button>
  </div>

  <!-- ಅಂಕ ಪ್ಯಾನೆಲ್ -->
  <div id="scorePanel" class="score-panel hidden">
    <h2 id="scoreName">ವಿದ್ಯಾರ್ಥಿ</h2>
    <div><span class="score-value" id="scoreValue">0</span><span class="score-total"> / 225</span></div>
    <div class="score-message" id="scoreMessage"></div>
  </div>

  <!-- ಫಲಿತಾಂಶ ವಿಮರ್ಶೆ -->
  <div id="reviewSection" class="review-section hidden">
    <h3>📋 ಫಲಿತಾಂಶ ವಿಮರ್ಶೆ</h3>
    <div class="review-filters">
      <button class="filter-btn active" data-filter="all">ಎಲ್ಲಾ</button>
      <button class="filter-btn" data-filter="wrong">ತಪ್ಪು ಉತ್ತರಗಳು</button>
      <button class="filter-btn" data-filter="correct">ಸರಿ ಉತ್ತರಗಳು</button>
      <button class="filter-btn" data-filter="unanswered">ಉತ್ತರಿಸದ ಪ್ರಶ್ನೆಗಳು</button>
    </div>
    <div id="reviewList"></div>
  </div>

  <div class="footer-note">ಎನ್‌ಎಂಎಂಎಸ್-ಜಿಮ್ಯಾಟ್ 2017 ಆಧಾರಿತ · ಕರ್ನಾಟಕ ಡಿಎಸ್‌ಇಆರ್‌ಟಿ</div>
</div>

<script>
  // =============================================================
  // 1. ಪ್ರಶ್ನೆ ಬ್ಯಾಂಕ್ (ಎಲ್ಲಾ 225) + ಶೀರ್ಷಿಕೆ + ಚಿತ್ರ
  // =============================================================
  const questions = [
    { title: "ಸಂಖ್ಯಾ ಶ್ರೇಣಿ", q: "1) 3, 5, 8, 13, 20, ?", opts: ["29","30","31","33"], ans: 2, exp: "ವ್ಯತ್ಯಾಸಗಳು ಅನುಕ್ರಮ ಅವಿಭಾಜ್ಯ ಸಂಖ್ಯೆಗಳು: +2, +3, +5, +7, +11 → 20+11=31" },
    { title: "ಸಂಖ್ಯಾ ಶ್ರೇಣಿ", q: "2) 1, 2, 6, 15, 31, ?", opts: ["56","55","49","47"], ans: 1, exp: "ವ್ಯತ್ಯಾಸಗಳು ವರ್ಗ ಸಂಖ್ಯೆಗಳು: +1, +4, +9, +16, +25 → 31+25=56" },
    { title: "ಸಂಖ್ಯಾ ಶ್ರೇಣಿ", q: "3) 1, 1, 2, 6, ?, 120", opts: ["10","18","20","24"], ans: 4, exp: "1,2,3,4,5 ರಿಂದ ಗುಣಿಸಿ: 1×1=1, 1×2=2, 2×3=6, 6×4=24, 24×5=120" },
    { title: "ಸಂಖ್ಯಾ ಶ್ರೇಣಿ", q: "4) 25, 24, ?, 19, 15, 10", opts: ["20","21","22","23"], ans: 3, exp: "1,2,3,4,5 ಕಳೆಯಿರಿ: 25-1=24, 24-2=22, 22-3=19, 19-4=15, 15-5=10" },
    { title: "ಸಂಖ್ಯಾ ಶ್ರೇಣಿ", q: "5) 26, 37, 50, 65, 82, ?", opts: ["99","101","102","122"], ans: 2, exp: "n²+1: 5²+1=26, 6²+1=37, 7²+1=50, 8²+1=65, 9²+1=82, 10²+1=101" },
    { title: "ಸಂಖ್ಯಾ ಶ್ರೇಣಿ", q: "6) 2, 12, 30, 56, ?, 132", opts: ["90","100","110","125"], ans: 1, exp: "n²–n: 2²–2=2, 4²–4=12, 6²–6=30, 8²–8=56, 10²–10=90, 12²–12=132" },
    { title: "ಸಂಖ್ಯಾ ಶ್ರೇಣಿ", q: "7) 9, 17, 32, 61, 118, ?", opts: ["219","226","231","232"], ans: 3, exp: "×2 –1, –2, –3, –4, –5: 9×2–1=17, 17×2–2=32, 32×2–3=61, 61×2–4=118, 118×2–5=231" },
    { title: "ಸಂಖ್ಯಾ ಶ್ರೇಣಿ", q: "8) 5, 2, 8, 6, 14, 14, ?, ?", opts: ["24,28","23,26","17,26","26,34"], ans: 2, exp: "ಎರಡು ಪರ್ಯಾಯ ಶ್ರೇಣಿಗಳು: ಬೆಸ +3,+6,+9; ಸಮ +4,+8,+12 → 23,26" },
    { title: "ಸಂಖ್ಯಾ ಶ್ರೇಣಿ", q: "9) 180, 100, 48, 18, 4, ?", opts: ["3","2","1","0"], ans: 4, exp: "n³–n²: 6³–6²=180, 5³–5²=100, 4³–4²=48, 3³–3²=18, 2³–2²=4, 1³–1²=0" },
    { title: "ಸಂಖ್ಯಾ ಶ್ರೇಣಿ", q: "10) 4, 4, 7, 11, ?, ?, 19, 67", opts: ["12,24","12,30","6,30","19,28"], ans: 2, exp: "ಪರ್ಯಾಯ: n²+3 ಮತ್ತು n³+3: 1²+3=4, 1³+3=4, 2²+3=7, 2³+3=11, 3²+3=12, 3³+3=30, 4²+3=19, 4³+3=67" },
    { title: "ತಪ್ಪು ಸಂಖ್ಯೆ", q: "11) 4, 7, 12, 18, 28, 39", opts: ["4","12","18","39"], ans: 3, exp: "ವ್ಯತ್ಯಾಸಗಳು +3,+5,+7,+9,+11 ಆಗಿರಬೇಕು. 12+7=19, 18 ಅಲ್ಲ" },
    { title: "ತಪ್ಪು ಸಂಖ್ಯೆ", q: "12) 5, 3, 8, 6, 11, 10, 14, 12, 17", opts: ["10","11","14","17"], ans: 1, exp: "ಮಾದರಿ: 5,3 (–2); 8,6 (–2); 11,10 (–1) ತಪ್ಪು; 14,12 (–2); 17. ತಪ್ಪು ಸಂಖ್ಯೆ 11" },
    { title: "ತಪ್ಪು ಸಂಖ್ಯೆ", q: "13) 2, 3, 5, 9, 17, 35", opts: ["3","5","17","35"], ans: 4, exp: "×2–1: 2×2–1=3, 3×2–1=5, 5×2–1=9, 9×2–1=17, 17×2–1=33, 35 ಅಲ್ಲ" },

    { title: "ದರ್ಪಣ ಪ್ರತಿಬಿಂಬ", q: "219) ವಕ್ರ ಆಕೃತಿಯ ದರ್ಪಣ ಪ್ರತಿಬಿಂಬ", opts: ["1","2","3","4"], ans: 2, exp: "ಆಯ್ಕೆ 2", img: "https://i.imgur.com/8Q6Z9QO.png" },
    { title: "ದರ್ಪಣ ಪ್ರತಿಬಿಂಬ", q: "220) MATRIX ನ ದರ್ಪಣ ಪ್ರತಿಬಿಂಬ", opts: ["1","2","3","4"], ans: 3, exp: "ಆಯ್ಕೆ 3", img: "https://i.imgur.com/8Q6Z9QO.png" },
    { title: "ದರ್ಪಣ ಪ್ರತಿಬಿಂಬ", q: "221) PUNCH ನ ದರ್ಪಣ ಪ್ರತಿಬಿಂಬ", opts: ["1","2","3","4"], ans: 4, exp: "ಆಯ್ಕೆ 4", img: "https://i.imgur.com/8Q6Z9QO.png" },
    { title: "ಅಡಗಿರುವ ಆಕೃತಿ", q: "222) ಅಡಗಿರುವ ಆಕೃತಿ (ಚೌಕ ಮತ್ತು X)", opts: ["1","2","3","4"], ans: 2, exp: "ಆಯ್ಕೆ 2", img: "https://i.imgur.com/8Q6Z9QO.png" },
    { title: "ಅಡಗಿರುವ ಆಕೃತಿ", q: "223) ಅಡಗಿರುವ ಆಕೃತಿ (ತ್ರಿಭುಜ ಮತ್ತು ವೃತ್ತ)", opts: ["1","2","3","4"], ans: 3, exp: "ಆಯ್ಕೆ 3", img: "https://i.imgur.com/8Q6Z9QO.png" },
    { title: "ಅಡಗಿರುವ ಆಕೃತಿ", q: "224) ಅಡಗಿರುವ ಆಕೃತಿ (ವಜ್ರಾಕೃತಿ ಮತ್ತು ಶಿಲುಬೆ)", opts: ["1","2","3","4"], ans: 2, exp: "ಆಯ್ಕೆ 2", img: "https://i.imgur.com/8Q6Z9QO.png" },
    { title: "ಅಡಗಿರುವ ಆಕೃತಿ", q: "225) ಅಡಗಿರುವ ಆಕೃತಿ (ಪಂಚಭುಜ ಮತ್ತು ಆಕೃತಿ)", opts: ["1","2","3","4"], ans: 1, exp: "ಆಯ್ಕೆ 1", img: "https://i.imgur.com/8Q6Z9QO.png" }
  ];

  // =============================================================
  // 2. ಸ್ಥಿತಿ ಮತ್ತು ಅಂಶಗಳು
  // =============================================================
  const totalQuestions = questions.length;
  let currentIndex = 0;
  const userAnswers = new Array(totalQuestions).fill(null);
  let quizFinished = false;
  let currentFilter = 'all';

  const quizArea = document.getElementById('quizArea');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  const resetBtn = document.getElementById('resetBtn');
  const scorePanel = document.getElementById('scorePanel');
  const scoreValue = document.getElementById('scoreValue');
  const scoreMessage = document.getElementById('scoreMessage');
  const scoreName = document.getElementById('scoreName');
  const reviewSection = document.getElementById('reviewSection');
  const reviewList = document.getElementById('reviewList');
  const studentNameInput = document.getElementById('studentName');

  // =============================================================
  // 3. ಪ್ರಸ್ತುತ ಪ್ರಶ್ನೆಯನ್ನು ರೆಂಡರ್ ಮಾಡು
  // =============================================================
  function renderCurrentQuestion() {
    if (quizFinished) return;

    const idx = currentIndex;
    const q = questions[idx];
    const selected = userAnswers[idx];

    let html = `<div class="question-card">`;
    html += `<div class="q-num">ಪ್ರಶ್ನೆ ${idx + 1} / ${totalQuestions}</div>`;
    html += `<div class="q-title">${q.title}</div>`;
    html += `<div class="q-text">${q.q}</div>`;
    html += `<div class="options">`;

    q.opts.forEach((opt, optIdx) => {
      const letter = String.fromCharCode(65 + optIdx);
      const isSelected = selected === optIdx;
      html += `<label class="option ${isSelected ? 'selected' : ''}" data-optidx="${optIdx}">
        <input type="radio" name="q${idx}" value="${optIdx}" ${isSelected ? 'checked' : ''}>
        <span>${letter}) ${opt}</span>
      </label>`;
    });

    html += `</div>`;
    // ವಿವರಣೆ + ಚಿತ್ರ (ಆಯ್ಕೆ ಮಾಡಿದಾಗ ತೋರಿಸಲಾಗುತ್ತದೆ)
    html += `<div class="explain hidden" id="exp-${idx}"><strong>ವಿವರಣೆ:</strong> ${q.exp}</div>`;
    if (q.img) {
      html += `<div class="related-image hidden" id="img-${idx}">
        <img src="${q.img}" alt="ಸಂಬಂಧಿತ ಚಿತ್ರ" loading="lazy">
        <div class="img-label">ಸಂಬಂಧಿತ ಚಿತ್ರ</div>
      </div>`;
    }
    html += `</div>`;

    quizArea.innerHTML = html;

    // ಈವೆಂಟ್ ಲಿಸನರ್‌ಗಳನ್ನು ಲಗತ್ತಿಸಿ
    document.querySelectorAll('.option input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const optIdx = parseInt(e.target.value);
        userAnswers[currentIndex] = optIdx;
        // ವರ್ಗಗಳನ್ನು ನವೀಕರಿಸಿ
        document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
        e.target.closest('.option').classList.add('selected');

        // ವಿವರಣೆ ಮತ್ತು ಚಿತ್ರ ತೋರಿಸಿ
        const expEl = document.getElementById(`exp-${currentIndex}`);
        if (expEl) expEl.classList.remove('hidden');
        const imgEl = document.getElementById(`img-${currentIndex}`);
        if (imgEl) imgEl.classList.remove('hidden');

        // ಮುಂದೆ ಬಟನ್ ಸಕ್ರಿಯಗೊಳಿಸಿ
        updateButtons();
      });
    });

    // ಮರು-ರೆಂಡರ್‌ನಲ್ಲಿ ವಿವರಣೆ ಮತ್ತು ಚಿತ್ರ ಮರೆಮಾಡಿ (ಆಯ್ಕೆ ಇದ್ದರೆ ತೋರಿಸಿ)
    const expEl = document.getElementById(`exp-${idx}`);
    if (expEl) {
      if (selected !== null) expEl.classList.remove('hidden');
      else expEl.classList.add('hidden');
    }
    const imgEl = document.getElementById(`img-${idx}`);
    if (imgEl) {
      if (selected !== null) imgEl.classList.remove('hidden');
      else imgEl.classList.add('hidden');
    }

    updateProgress();
    updateButtons();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // =============================================================
  // 4. ಪ್ರಗತಿ ಮತ್ತು ಬಟನ್‌ಗಳನ್ನು ನವೀಕರಿಸಿ
  // =============================================================
  function updateProgress() {
    const answered = userAnswers.filter(a => a !== null).length;
    const pct = Math.round((answered / totalQuestions) * 100);
    progressFill.style.width = pct + '%';
    progressText.textContent = `${answered} / ${totalQuestions}`;
  }

  function updateButtons() {
    prevBtn.disabled = currentIndex === 0;
    // ಕೊನೆಯ ಪ್ರಶ್ನೆಯಲ್ಲಿ "ಮುಂದೆ" ಬದಲಿಗೆ "ಸಲ್ಲಿಸಿ" ತೋರಿಸಿ
    if (currentIndex === totalQuestions - 1) {
      nextBtn.classList.add('hidden');
      submitBtn.classList.remove('hidden');
    } else {
      nextBtn.classList.remove('hidden');
      submitBtn.classList.add('hidden');
    }
  }

  // =============================================================
  // 5. ಮುಂದೆ / ಹಿಂದೆ
  // =============================================================
  function goNext() {
    if (currentIndex < totalQuestions - 1) {
      currentIndex++;
      renderCurrentQuestion();
    }
  }

  function goPrev() {
    if (currentIndex > 0) {
      currentIndex--;
      renderCurrentQuestion();
    }
  }

  // =============================================================
  // 6. ಸಲ್ಲಿಸಿ ಮತ್ತು ಅಂಕ ನೀಡಿ + ವಿಮರ್ಶೆ ರೆಂಡರ್
  // =============================================================
  function submitQuiz() {
    quizFinished = true;

    // ಹೆಸರು
    const name = studentNameInput.value.trim() || 'ವಿದ್ಯಾರ್ಥಿ';
    scoreName.textContent = name;

    // ಎಣಿಸಿ
    let correct = 0;
    questions.forEach((q, idx) => {
      const selected = userAnswers[idx];
      if (selected !== null && selected === q.ans) correct++;
    });

    const pct = Math.round((correct / totalQuestions) * 100);
    scoreValue.textContent = correct;

    let msg = '';
    if (pct >= 90) msg = '🏆 ಅದ್ಭುತ! ನೀವು ಜಿಮ್ಯಾಟ್ ಚಾಂಪಿಯನ್!';
    else if (pct >= 75) msg = '🌟 ಶ್ರೇಷ್ಠ! ನಿಮ್ಮ ಶ್ರಮ ಮುಂದುವರಿಸಿ.';
    else if (pct >= 60) msg = '👍 ಒಳ್ಳೆಯದು! ಸ್ವಲ್ಪ ಹೆಚ್ಚು ಅಭ್ಯಾಸದಿಂದ ಉತ್ತಮ ಫಲಿತಾಂಶ.';
    else if (pct >= 40) msg = '📘 ಕೆಟ್ಟದಲ್ಲ, ವಿವರಣೆಗಳನ್ನು ಪರಿಶೀಲಿಸಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.';
    else msg = '💪 ಅಭ್ಯಾಸ ಮುಂದುವರಿಸಿ! ನೀವು ಸುಧಾರಿಸಬಹುದು.';
    scoreMessage.textContent = `${msg} (${pct}%)`;
    scorePanel.classList.remove('hidden');

    // ವಿಮರ್ಶೆ ವಿಭಾಗ
    renderReview();
    reviewSection.classList.remove('hidden');

    // ಸ್ಕೋರ್ ಪ್ಯಾನೆಲ್‌ಗೆ ಸ್ಕ್ರಾಲ್ ಮಾಡಿ
    scorePanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // =============================================================
  // 7. ಫಲಿತಾಂಶ ವಿಮರ್ಶೆ ರೆಂಡರ್
  // =============================================================
  function renderReview() {
    const filter = currentFilter;
    let html = '';

    questions.forEach((q, idx) => {
      const selected = userAnswers[idx];
      const isCorrect = selected !== null && selected === q.ans;
      const isUnanswered = selected === null;

      // ಫಿಲ್ಟರ್ ಅನ್ವಯಿಸಿ
      if (filter === 'wrong' && (isCorrect || isUnanswered)) return;
      if (filter === 'correct' && !isCorrect) return;
      if (filter === 'unanswered' && !isUnanswered) return;

      const cardClass = isCorrect ? 'correct' : (isUnanswered ? 'unanswered' : 'wrong');
      const statusText = isCorrect ? '✅ ಸರಿ' : (isUnanswered ? '⚠️ ಉತ್ತರಿಸಿಲ್ಲ' : '❌ ತಪ್ಪು');

      html += `<div class="review-card ${cardClass}">`;
      html += `<div class="r-q-num">ಪ್ರಶ್ನೆ ${idx + 1} · ${statusText}</div>`;
      html += `<div class="r-q-title">${q.title}</div>`;
      html += `<div class="r-q-text">${q.q}</div>`;
      html += `<div class="review-options">`;

      q.opts.forEach((opt, optIdx) => {
        const letter = String.fromCharCode(65 + optIdx);
        const isAnswer = optIdx === q.ans;
        const isUserChoice = selected === optIdx;

        let optClass = '';
        if (isAnswer) optClass = 'correct-option';
        else if (isUserChoice && !isAnswer) optClass = 'wrong-option';

        let tag = '';
        if (isAnswer) tag = '<span class="tag tag-correct">ಸರಿ ಉತ್ತರ</span>';
        else if (isUserChoice) tag = '<span class="tag tag-wrong">ನಿಮ್ಮ ಉತ್ತರ</span>';

        html += `<div class="review-option ${optClass}">
          <span>${letter}) ${opt}</span>
          ${tag}
        </div>`;
      });

      html += `</div>`;

      // ವಿವರಣೆ
      const expClass = isCorrect ? 'correct-explain' : (isUnanswered ? '' : 'wrong-explain');
      html += `<div class="explain ${expClass}"><strong>ವಿವರಣೆ:</strong> ${q.exp}</div>`;

      // ಸಂಬಂಧಿತ ಚಿತ್ರ (ತಪ್ಪು ಅಥವಾ ಉತ್ತರಿಸದ ಪ್ರಶ್ನೆಗಳಿಗೆ)
      if (q.img && !isCorrect) {
        html += `<div class="related-image">
          <img src="${q.img}" alt="ಸಂಬಂಧಿತ ಚಿತ್ರ" loading="lazy">
          <div class="img-label">ಸಂಬಂಧಿತ ಚಿತ್ರ</div>
        </div>`;
      }

      html += `</div>`;
    });

    if (html === '') {
      html = '<p style="text-align:center; color:#6e8ba8;">ಈ ವರ್ಗದಲ್ಲಿ ಯಾವುದೇ ಪ್ರಶ್ನೆಗಳಿಲ್ಲ.</p>';
    }

    reviewList.innerHTML = html;
  }

  // =============================================================
  // 8. ಫಿಲ್ಟರ್ ಬಟನ್‌ಗಳು
  // =============================================================
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      if (quizFinished) renderReview();
    });
  });

  // =============================================================
  // 9. ಮರುಹೊಂದಿಸಿ
  // =============================================================
  function resetQuiz() {
    quizFinished = false;
    currentIndex = 0;
    userAnswers.fill(null);
    currentFilter = 'all';
    scorePanel.classList.add('hidden');
    reviewSection.classList.add('hidden');
    submitBtn.classList.add('hidden');
    nextBtn.classList.remove('hidden');
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
    renderCurrentQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // =============================================================
  // 10. ಆರಂಭ
  // =============================================================
  renderCurrentQuestion();

  // ಈವೆಂಟ್ ಲಿಸನರ್‌ಗಳು
  prevBtn.addEventListener('click', goPrev);
  nextBtn.addEventListener('click', goNext);
  submitBtn.addEventListener('click', submitQuiz);
  resetBtn.addEventListener('click', resetQuiz);

  // ಕೀಬೋರ್ಡ್ ಶಾರ್ಟ್‌ಕಟ್
  document.addEventListener('keydown', (e) => {
    if (quizFinished) return;
    if (e.key === 'ArrowRight') goNext();
    if (e.key === 'ArrowLeft') goPrev();
  });

  // ಹೆಸರು ನಮೂದಿಸಿದಾಗ ಸ್ಕೋರ್ ಪ್ಯಾನೆಲ್‌ನಲ್ಲಿ ನವೀಕರಿಸಿ
  studentNameInput.addEventListener('input', () => {
    if (!scorePanel.classList.contains('hidden')) {
      scoreName.textContent = studentNameInput.value.trim() || 'ವಿದ್ಯಾರ್ಥಿ';
    }
  });
</script>
